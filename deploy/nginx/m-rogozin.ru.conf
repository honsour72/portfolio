server {
    listen 80;
    listen [::]:80;
    server_name m-rogozin.ru www.m-rogozin.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name m-rogozin.ru www.m-rogozin.ru;

    root /var/www/m-rogozin/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/m-rogozin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m-rogozin.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/m-rogozin-access.log;
    error_log /var/log/nginx/m-rogozin-error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self'; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /_astro/ {
        try_files $uri =404;
        expires 1y;
    }

    location /files/ {
        try_files $uri =404;
        expires 1h;
    }

    location /images/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
